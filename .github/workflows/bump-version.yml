name: Bump version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: patch, minor, major, or auto from conventional commits
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: auto

permissions:
  contents: write

jobs:
  bump:
    name: Bump packages and changelogs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version from commits
        id: bump
        run: python3 tool/bump_version.py --bump "${{ inputs.bump }}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md README.md example/pubspec.yaml packages tool/bump_version.py
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }}"
          git push
