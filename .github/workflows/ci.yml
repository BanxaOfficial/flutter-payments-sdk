name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Analyze & test (Flutter ${{ matrix.flutter }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter: ["3.19.0", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter }}
          cache: true
      - run: flutter --version
      - run: dart pub get
      - run: dart run melos bootstrap
      - name: Analyze
        run: |
          dart run melos exec --scope="banxa_payments_flutter*" -- \
            flutter analyze
      - name: Test
        run: |
          dart run melos exec --scope="banxa_payments_flutter*" -- \
            flutter test

  android-unit:
    name: Android unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart pub get
      - run: dart run melos bootstrap
      - run: flutter pub get
        working-directory: example
      - name: Plugin unit tests
        working-directory: example/android
        run: ./gradlew :banxa_payments_flutter_android:testDebugUnitTest

  ios-build:
    name: iOS example compile
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart pub get
      - run: dart run melos bootstrap
      - name: Build iOS simulator (no codesign)
        working-directory: example
        run: flutter build ios --simulator --no-codesign
