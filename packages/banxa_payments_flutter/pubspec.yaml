name: banxa_payments_flutter
description: Banxa native checkout Flutter plugin (partner-api v2 + Primer).
version: 0.1.0
publish_to: none
homepage: https://banxa.com
repository: https://github.com/BanxaOfficial/flutter-payments-sdk
issue_tracker: https://github.com/BanxaOfficial/flutter-payments-sdk/issues

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  banxa_payments_flutter_platform_interface:
    path: ../banxa_payments_flutter_platform_interface
  banxa_payments_flutter_ios:
    path: ../banxa_payments_flutter_ios
  banxa_payments_flutter_android:
    path: ../banxa_payments_flutter_android
  http: ^1.6.0
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  plugin_platform_interface: ^2.1.8
flutter:
  plugin:
    platforms:
      ios:
        default_package: banxa_payments_flutter_ios
      android:
        default_package: banxa_payments_flutter_android
