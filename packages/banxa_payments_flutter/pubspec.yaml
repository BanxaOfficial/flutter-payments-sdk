name: banxa_payments_flutter
description: >-
  Banxa partner-api v2 Flutter plugin: catalog and order APIs, Primer native
  checkout, and hosted checkout in a WebView. Preview (0.1.0).
version: 0.1.0
homepage: https://banxa.com
repository: https://github.com/BanxaOfficial/flutter-payments-sdk
issue_tracker: https://github.com/BanxaOfficial/flutter-payments-sdk/issues
topics:
  - payments
  - checkout

environment:
  sdk: ">=3.12.2 <4.0.0"
  flutter: ">=3.44.9"

dependencies:
  flutter:
    sdk: flutter
  banxa_payments_flutter_platform_interface: ^0.1.0
  banxa_payments_flutter_ios: ^0.1.0
  banxa_payments_flutter_android: ^0.1.0
  http: ^1.6.0
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  plugin_platform_interface: ^2.1.8

flutter:
  plugin:
    platforms:
      ios:
        default_package: banxa_payments_flutter_ios
      android:
        default_package: banxa_payments_flutter_android
