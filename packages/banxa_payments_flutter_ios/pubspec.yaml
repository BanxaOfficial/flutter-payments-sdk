name: banxa_payments_flutter_ios
description: >-
  iOS implementation of the Banxa Flutter payments plugin (PrimerSDK). App code
  should depend on banxa_payments_flutter, not this package.
version: 0.1.0
homepage: https://banxa.com
repository: https://github.com/BanxaOfficial/flutter-payments-sdk
issue_tracker: https://github.com/BanxaOfficial/flutter-payments-sdk/issues
topics:
  - payments

environment:
  sdk: ">=3.12.2 <4.0.0"
  flutter: ">=3.44.9"

dependencies:
  flutter:
    sdk: flutter
  banxa_payments_flutter_platform_interface: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: BanxaPaymentsFlutterIosPlugin
        dartPluginClass: BanxaPaymentsFlutterIos
